Odometry:
  name: TartanVOStereo

  depth:
    type: TartanVODepth
    args:
      # weight: #./Model/TartanVO_depth_cov.pth
      device: cuda
      cov_mode: None #Est

  match:
    type: TartanVOMatcher
    args:
      weight: ./Model/MACVO_posenet.pkl
      device: cuda

  tartanvo:
      weight: ./Model/MACVO_posenet.pkl
      device: cuda

  keyframe:
    type: UniformKeyframe
    args:
      keyframe_freq: 1

Datas: !include ../../Common/DeepODO_stereo_experiments.yaml
Preprocess: !include ../../Common/Preprocess.yaml
