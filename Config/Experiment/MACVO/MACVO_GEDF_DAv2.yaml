#
# MAC-VO with monocular Depth Anything V2 frontend + the G-EDF scan-to-map
# backend (GEDF_PGO, graph_type "gedf+icp").
#
# Identical to MACVO_GEDF_DAv3.yaml except for the monodepth block, so that
# the two G-EDF setups differ only in the depth model. See the DAv3 config
# header for the mono-specific optimizer notes (cov_trace_gate disabled,
# median-relative depth-cov selectors upstream).
#

Common:
  device: &device cuda

Odometry:
  name: MACVO-GEDF-DAv2
  args:
    device: *device
    edgewidth: 32
    num_point: 1000
    match_cov_default: 0.25
    profile: false
    mapping: true

  cov:
    obs:
      type: MatchCovariance
      args:
        device: *device
        kernel_size: 31
        match_cov_default: 0.25
        min_depth_cov: 0.01
        min_flow_cov: 0.25

  keypoint:
    type: CovAwareSelector_NoDepth
    args:
      device: *device
      kernel_size: 7
      mask_width: 32
      max_match_cov: 10.
      # Median-relative depth-cov filter: keep pixels below median x 1.0
      # (absolute mono depth-cov scales are uninformative).
      depth_cov_rel: 1.0

  mappoint:
    type: MappingPointSelector
    args:
      device: *device
      max_depth: 7.0
      max_depth_cov: 1.0
      mask_width: 32
      depth_cov_rel: 1.0  # tighten to median-relative: map from reliable pixels only

  frontend:
    type: MonocularFrontend
    args:
      device: *device
      parallel: true
      match:
        type: FlowFormerCovMatcher
        args:
          weight: ./Model/MACVO_FrontendCov.pth
          device: *device
          enc_dtype: fp32
          dec_dtype: fp32
      monodepth:
        type: DepthAnythingV2
        args:
          weight: C:/ai_checkpoints/monodepth/depth_anything_v2_vitl.pth
          encoder: vitl
          scale_factor: 1000.
          device: *device

  motion:
    type: StaticMotionModel
    args:

  outlier:
    type: CovarianceSanityFilter
    args:

  postprocess:
    type: MotionInterpolate
    args:

  keyframe:
    type: AllKeyframe
    args:

  optimizer:
    type: GEDF_PGO
    args:
      device: cpu           # solver device; the mapper has its own (map.online.device)
      vectorize: true
      parallel: true
      autodiff: false       # analytic Jacobians (LM_analytic)
      graph_type: gedf+icp  # "gedf" = pure field registration
      map:
        source: online      # "prebuilt" localizes against map.path instead
        path: ""            # GDF1 .bin path; only used when source is "prebuilt"
        insert_keypoints: true
        insert_dense: false
        min_gaussians: 100  # field factor stays inert until the map has this many
        online:
          device: *device
          cube_size: 1.0
          num_gaussians: 8
          sample_points: 1000
          budget_cubes_per_frame: 8   # pure-gedf (graph_type "gedf") prefers 16:
                                      # ATE 1.108->0.671 (s0), 0.968->0.698 (s1)
                                      # on plane_nose[80:160]; untested for gedf+icp
          mae_target: 0.03
          cov_trace_gate: 0.0   # disabled for monocular depth (see DAv3 config header)
      field:
        weighting: mahalanobis
        sigma: 0.20         # field-error floor (m); keeps the young online map from
                            # outweighing the ICP factor (0.10 is fine for prebuilt maps).
                            # 0.20 from a sweep on EIVA plane_nose[40:200]: ATE RMSE
                            # 1.247 -> 0.910 (seed 0), 1.125 -> 1.025 (seed 1) vs 0.30.
        oob_value_threshold: 19.0
        oob_residual: 5.0
        max_grad_norm: 10.0
      solver:
        coarse_kernel_delta: 3.0
        coarse_steps: 10
        fine_kernel_delta: 0.5
        fine_steps: 10
      viz:                  # Rerun map visualization (active only with --useRR)
        every: 3            # log a map snapshot every N keyframes; 0 = disabled
        iso: 0.10           # keep sampled points with field value < iso (m)
        resolution: 0.10    # sampling grid resolution (m)
        max_points: 100000

Datas: !include ../Common/DeepODO_mono_experiments.yaml
Preprocess: !include ../Common/Preprocess.yaml
