#
# OPTIMAL: DAv3 + GTSAM (pose2point, SE(3)) — optimizer defaults.
#
# ATE RMSE 0.689 m on EIVA plane_nose[80:160]; 1.702 m on plane_nose[40:200].
# Sources: ProgressReports/2026-07-06_optimizer-hyperparameter-sweep.md,
#          ProgressReports/2026-07-07_gtsam-alignment-sweep.md
#
# What makes it optimal:
#   - Optimizer DEFAULTS (huber_delta 0.1, huber_delta_prev 1.0, match_atol
#     1.0, prior_sigma 1e-4, max_iterations 20). The tuned DAv2 combo
#     transfers NEGATIVELY here (1.702 -> 1.757) — nothing transfers between
#     depth models.
#   - NO alignment block: sim3 is neutral (0.689 -> 0.695-0.697) and sl4
#     hurts outright (+41 %). DA3NESTED-giant depth is already scale-consistent.
#   - parallel: false — sequential = deterministic, reproduces report numbers.
#
# Known cost: optimizer-bound — at num_point 1000, ~92 % of frame time is the
# GTSAM LM solve calling Python CustomFactor callbacks (~20 s/frame). Reduce
# num_point for speed at some accuracy cost.
#

Common:
  device: &device cuda

Odometry:
  name: MACVO-DAv3-p2p-ft
  args:
    device: *device
    edgewidth: 32
    num_point: 1000
    match_cov_default: 0.25
    profile: false
    mapping: true

  cov:
    obs:
      type: MatchCovariance
      args:
        device: *device
        kernel_size: 31
        match_cov_default: 0.25
        min_depth_cov: 0.01
        min_flow_cov: 0.25

  keypoint:
    type: CovAwareSelector_NoDepth
    args:
      device: *device
      kernel_size: 7
      mask_width: 32
      max_match_cov: 10.
      # (no max_depth/max_depth_cov: CovAwareSelector_NoDepth drops depth filters)

  mappoint:
    type: MappingPointSelector
    args:
      device: *device
      max_depth: 7.0
      max_depth_cov: 1.0
      mask_width: 32

  frontend:
    type: MonocularFrontend
    args:
      device: *device
      parallel: true
      # Multi-GPU: set device_depth to a second GPU to run depth and flow on
      # separate devices. Requires parallel: true. Omit to use a single GPU.
      # device_depth: cuda:1
      match:
        type: FlowFormerCovMatcher
        args:
          weight: ./Model/MACVO_FrontendCov.pth
          device: *device
          enc_dtype: fp32
          dec_dtype: fp32
      monodepth:
        type: DepthAnythingV3
        args:
          # The finetuned checkpoint is a single da3-giant model (keys
          # model.backbone/head/cam_enc). The base HF weight is the NESTED
          # giant-large; loading this .ckpt into the nested arch matches 0 keys
          # and leaves the net at random init -> garbage, nondeterministic depth.
          model_name: da3-giant
          weight: Z:/Research/weights/plane_nose_dav3/epoch=17-val_total_loss=0.1578.ckpt
          device: *device
          q90: 1.

  motion:
    type: StaticMotionModel
    args:

  outlier:
    type: CovarianceSanityFilter
    args:

  postprocess:
    type: MotionInterpolate
    args:

  keyframe:
    type: AllKeyframe
    args:

  optimizer:
    type: GTSAM_Graph
    args:
      device: cpu
      vectorize: true
      parallel: false         # sequential = deterministic; reproduces report numbers
      autodiff: true          # required by the config spec (not used for graph selection)
      graph_type: pose2point
      # Defaults are optimal for this frontend — do NOT copy the DAv2 combo
      # and do NOT enable alignment (see header).

Datas: !include ../../Common/DeepODO_mono_experiments_trim.yaml
Preprocess: !include ../../Common/Preprocess.yaml
