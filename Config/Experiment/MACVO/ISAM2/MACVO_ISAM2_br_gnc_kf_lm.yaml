#
# MACVO_ISAM2_br_gnc_kf.yaml + final_lm (ICRA mono benchmark arm, 2026-09-03).
#
# Identical to MACVO_ISAM2_br_gnc_kf.yaml (keyframe tracker, Parallax 100 px) plus
# `final_lm: true`: after the last frame ONE batch Levenberg-Marquardt solve runs over
# the entire accumulated iSAM2 graph -- keyframe pose-to-point factors included -- and
# every pose key's result replaces the online chain readout in the map, so poses.npy
# holds the batch-smoothed trajectory in the graph's own gauge.
#
Common:
  device: &device cuda

Odometry:
  name: MACVO-ISAM2-br-gnc-kf-lm
  args:
    device: *device
    edgewidth: 32
    num_point: 200        # Caps the SEEDS per frame; carried tracks are never dropped
    match_cov_default: 0.25
    profile: false
    mapping: true
    # Persistent graph: let nearly every frame reach the optimizer; the
    # backend's own min_support coast handles low-support frames.
    min_num_point: 1

  cov:
    obs:
      type: MatchCovariance
      args:
        device: *device
        kernel_size: 31
        match_cov_default: 0.25
        min_depth_cov: 0.01
        min_flow_cov: 0.25

  keypoint:
    type: TrackingCovAwareSelector
    args:
      device: *device
      mask_width: 32      # must stay >= edgewidth and > cov kernel_size // 2
      kernel_size: 7
      max_match_cov: 0.5
      median_rel: 1.5
      seed_radius: 90.0

  mappoint:
    type: MappingPointSelector
    args:
      device: *device
      max_depth: 7.0
      max_depth_cov: 1.0
      mask_width: 32

  frontend:
    type: MonocularFrontend
    args:
      device: *device
      parallel: false     # one CUDA stream = one allocator pool; parallel:true + the keyframe flow paged VRAM (24 GB card)
      match:
        type: FlowFormerCovMatcher
        args:
          weight: ./Model/MACVO_FrontendCov.pth
          device: *device
          enc_dtype: fp32
          dec_dtype: fp32
      monodepth:
        type: DepthAnythingV3
        args:
          model_name: da3nested-giant-large
          weight: depth-anything/DA3NESTED-GIANT-LARGE-1.1
          device: *device
          q90: 1.

  motion:
    type: StaticMotionModel
    args:

  outlier:
    # Identity on purpose: any row dropped between selector and map splits a
    # track; the ISAM2 backend applies its own depth/PSD gates per row.
    type: IdentityFilter
    args:

  postprocess:
    type: MotionInterpolate
    args:

  keyframe:
    type: AllKeyframe
    args:

  keyframe_tracker:
    type: Parallax
    args:
      px: 100.0
      max_gap: 20

  optimizer:
    type: ISAM2_Graph
    args:
      device: cpu
      parallel: false           # stateful persistent graph — sequential only
      factor_type: bearingrange
      kernel: huber             # ignored while gnc_rounds > 0 (GNC replaces it)
      kernel_delta: 0.1
      relin_threshold: 0.05
      relin_skip: 1
      extra_updates: 3
      warmup_frames: 10
      warmup_extra: 5
      depth_var_scale: 2.5
      accumulate_fvar: true
      motion_init: cv
      motion_prior_sigma: 0.3
      coast_sigma: 0.1
      min_support: 6
      readout: chain
      min_flow_cov: 0.25
      min_depth_cov: 0.01
      match_cov_default: 0.25
      kf_cov_scale: 1.0
      final_lm: true
      final_lm_max_iters: 100
      gnc_rounds: 5
      gnc_c: 0.4
      gnc_mu_rate: 5.0

Datas: !include ../../Common/DeepODO_mono_experiments.yaml
Preprocess: !include ../../Common/Preprocess.yaml
