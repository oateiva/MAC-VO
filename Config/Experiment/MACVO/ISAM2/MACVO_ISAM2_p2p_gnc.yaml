#
# Persistent-graph iSAM2 backend, pose-to-point factors + GNC-GM.
#
# Port of learningUAVO's isam2_tracker.py winning arm `Z_p2p_gnc`
# (results/sweep_online_plane_nose_full: best chain APE@100 = 1.553 on
# plane_nose_full; on the 80-frame plane_nose it was the outright best chain
# and online arm), i.e. the learningUAVO flags
#   --cov-max-match 0.5 --relin-threshold 0.05 --extra-updates 3
#   --seed-radius 90 --depth-var-scale 2.5 --motion-init cv --motion-prior 0.2
#   --gnc-rounds 5 --gnc-c 0.4 --gnc-mu-rate 5.0
# on the FlowFormerCov + pretrained DAv3 frontend (MACVO_MonoDAv3 base).
#
# gnc_damped is OFF here, matching the measured arm's provenance: the sweep
# number came from the undamped path, and learningUAVO found damped Dogleg on
# the Python pose-to-point factors unmeasurable at 566 frames (80 s/frame by
# frame 375, still rising). Undamped GNC never diverged for p2p on this data,
# but it carries no overflow guard — on NEW data prefer the damped default
# (delete the gnc_damped key) or the bearingrange GNC config, and re-sweep
# gnc_c (a residual scale in the depth map's own units) per depth source.
#

Common:
  device: &device cuda

Odometry:
  name: MACVO-ISAM2-p2p-gnc
  args:
    device: *device
    edgewidth: 32
    num_point: 200        # Caps the SEEDS per frame; carried tracks are never dropped
    match_cov_default: 0.25
    profile: false
    mapping: true
    # Persistent graph: let nearly every frame reach the optimizer; the
    # backend's own min_support coast handles low-support frames.
    min_num_point: 1

  cov:
    obs:
      type: MatchCovariance
      args:
        device: *device
        kernel_size: 31
        match_cov_default: 0.25
        min_depth_cov: 0.01
        min_flow_cov: 0.25

  keypoint:
    type: TrackingCovAwareSelector
    args:
      device: *device
      mask_width: 32      # must stay >= edgewidth and > cov kernel_size // 2
      kernel_size: 7
      max_match_cov: 0.5
      median_rel: 1.5
      seed_radius: 90.0

  mappoint:
    type: MappingPointSelector
    args:
      device: *device
      max_depth: 7.0
      max_depth_cov: 1.0
      mask_width: 32

  frontend:
    type: MonocularFrontend
    args:
      device: *device
      parallel: true
      match:
        type: FlowFormerCovMatcher
        args:
          weight: ./Model/MACVO_FrontendCov.pth
          device: *device
          enc_dtype: fp32
          dec_dtype: fp32
      monodepth:
        type: DepthAnythingV3
        args:
          model_name: da3nested-giant-large
          weight: depth-anything/DA3NESTED-GIANT-LARGE-1.1
          device: *device
          q90: 1.

  motion:
    type: StaticMotionModel
    args:

  outlier:
    # Identity on purpose: any row dropped between selector and map splits a
    # track; the ISAM2 backend applies its own depth/PSD gates per row.
    type: IdentityFilter
    args:

  postprocess:
    type: MotionInterpolate
    args:

  keyframe:
    type: AllKeyframe
    args:

  optimizer:
    type: ISAM2_Graph
    args:
      device: cpu
      parallel: false           # stateful persistent graph — sequential only
      factor_type: pose2point
      kernel: huber             # ignored while gnc_rounds > 0 (GNC replaces it)
      kernel_delta: 0.1
      relin_threshold: 0.05
      relin_skip: 1
      extra_updates: 3
      warmup_frames: 10
      warmup_extra: 5
      depth_var_scale: 2.5
      accumulate_fvar: true
      motion_init: cv
      motion_prior_sigma: 0.2
      coast_sigma: 0.1
      min_support: 6
      readout: chain
      min_flow_cov: 0.25
      min_depth_cov: 0.01
      match_cov_default: 0.25
      gnc_rounds: 5
      gnc_c: 0.4
      gnc_mu_rate: 5.0
      gnc_damped: false         # matches the measured arm — see header caveat

Datas: !include ../../Common/DeepODO_mono_experiments.yaml
Preprocess: !include ../../Common/Preprocess.yaml
