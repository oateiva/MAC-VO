#
# This configuration is **not** used to report numbers in the paper.
# To reproduce result in the paper, please use Paper_Reproduce.yaml
#
#
# MAC-VO Fast Mode (Jun 2025 Update)
#   Comparing to the Performant mode (MACVO_Performant), the Fast Mode uses
#   mixed-precision inference of fp32, fp16 and bf16. The fast mode can run
#   at 12.5fps on 480x640 images on RTX Ada 6000 GPU, almost twice the speed
#   as Performant Mode.
#
#   If minor degrade in accuracy (~5% increase in RTE and ROE) is acceptable,
#   then you should use Fast Mode for most of the time.
#

Common:
  # Some configurations are shared across multiple modules in Odometry, so I write them here.
  device: &device cuda

Odometry:
  name: MACVO-DAv2
  args:
    # Device directive to the VO system
    # NOTE: the system may not follow this device config strictly since some module
    # e.g. those rely on PWC-Net, only support running on cuda device.
    device: *device
    edgewidth: 32
    num_point: 200 # Upper bound of KPs in each frame

    # Match covariance for keypoint on first observation (sub-pixel uncertainty
    # caused by the quantized pixel)
    match_cov_default: 0.25

    # Profiling the system using torch, generate chrome json trace file.
    profile: false

    # Mapping mode provides the dense mapping
    mapping: true

  cov:
    obs:
      type: MatchCovariance
      args:
        device: *device
        kernel_size: 31
        match_cov_default: 0.25
        min_depth_cov: 0.05
        min_flow_cov: 0.25

  keypoint:
    type: CovAwareSelector_NoDepth
    args:
      device: *device
      kernel_size: 7
      mask_width: 32
      max_match_cov: 1.
      max_depth: 7.0
      max_depth_cov: 1.

  mappoint:
    # Mapping feature can be conveniently turn off by using
    # "type: NoKeypointSelector" instead of the config below.
    type: MappingPointSelector
    args:
      device: *device
      max_depth: 5.0
      max_depth_cov: .4
      mask_width: 32

  frontend:
    type: MonocularFrontend
    args:
      device: *device
      parallel: true
      # Multi-GPU: set device_depth to a second GPU to run depth and flow on separate devices.
      # Requires parallel: true for concurrent execution. Omit to use a single GPU.
      device_depth: cuda:1
      match:
        type: FlowFormerCovMatcher
        args:
          weight: ./Model/MACVO_FrontendCov.pth
          device: *device
          enc_dtype: fp32
          dec_dtype: fp32
          decoder_depth: 12
      monodepth:
        type: DepthAnythingV2
        args:
          weight: C:/ai_checkpoints/monodepth/depth_anything_v2_vitl.pth
          encoder: vitl
          scale_factor: 1000.
          device: *device
        # type: MetricDepthAnythingV2
        # args:
        #   weight: ./Model/depth_anything_v2_metric_vkitti_vitl.pth
        #   encoder: vitl
        #   max_depth: 80.


  motion:
    type: StaticMotionModel
    args:

  outlier:
    type: CovarianceSanityFilter
    args:

  postprocess:
    type: MotionInterpolate
    args:

  keyframe:
    type: AllKeyframe
    args:

  optimizer:
    type: GTSAM_Graph
    args:
      device: cpu
      vectorize: true
      parallel: true
      graph_type: pose2point
      parallel_timeout_s: 1.0 # timeout for waiting for parallel optimization result, in seconds. Set to None to wait indefinitely.
      # Hyperparameters below from a sweep on EIVA plane_nose[40:200] (Sim3
      # scaled+aligned ATE RMSE 0.563 -> 0.512 on seed 0, 0.566 -> 0.496 on
      # seed 1; sequential optimizer). Defaults were huber_delta 0.1,
      # huber_delta_prev 1.0, match_atol 1.0, prior_sigma 1e-4.
      huber_delta: 0.05       # robust kernel on pose->point factors
      huber_delta_prev: 3.0   # robust kernel on prev-frame reobservation factor
      match_atol: 2.0         # px tolerance for cross-frame keypoint association
      prior_sigma: 0.001      # gauge prior noise on anchor poses
      max_iterations: 20      # LM iteration cap

Datas: !include ../Common/DeepODO_mono_experiments.yaml
Preprocess: !include ../Common/Preprocess.yaml
