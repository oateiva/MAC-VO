#
# MAC-VO with monocular Depth Anything V3 frontend + the G-EDF scan-to-map
# backend (GEDF_PGO, graph_type "gedf+icp").
#
# Frontend / keypoint blocks match MACVO_MonoDAv3.yaml; the optimizer block
# matches MACVO_GEDF.yaml, with one mono-specific change: the mapper's
# covariance insert gate is disabled (cov_trace_gate: 0.0) because monocular
# depth covariances are much larger than stereo (max_depth_cov is 1.0 here vs
# 0.005 in the stereo config) and the default gate would starve the map.
# Selecting RELIABLE points for the map is the job of the keypoint /
# mappoint selectors upstream.
#

Common:
  device: &device cuda

Odometry:
  name: MACVO-GEDF-DAv3
  args:
    device: *device
    edgewidth: 32
    num_point: 1000
    match_cov_default: 0.25
    profile: false
    mapping: true

  cov:
    obs:
      type: MatchCovariance
      args:
        device: *device
        kernel_size: 31
        match_cov_default: 0.25
        min_depth_cov: 0.01
        min_flow_cov: 0.25

  keypoint:
    type: CovAwareSelector_NoDepth
    args:
      device: *device
      kernel_size: 7
      mask_width: 32
      max_match_cov: 10.
      # Median-relative depth-cov filter: keep pixels below median x 1.0, i.e.
      # the more reliable half of DAv3's depth. Absolute depth-cov thresholds
      # stay out of this selector (monocular scales are uninformative).
      depth_cov_rel: 1.0

  mappoint:
    type: MappingPointSelector
    args:
      device: *device
      max_depth: 7.0
      max_depth_cov: 1.0
      mask_width: 32
      depth_cov_rel: 1.0  # tighten to median-relative: map from reliable pixels only

  frontend:
    type: MonocularFrontend
    args:
      device: *device
      parallel: true
      # DA3NESTED-giant is large; running depth, FlowFormer and the GEDF map all
      # on one GPU OOMs a 24 GB card. Offload the depth model to a second GPU.
      # Remove/comment this if you only have one GPU (and expect an OOM).
      device_depth: cuda:1
      match:
        type: FlowFormerCovMatcher
        args:
          weight: ./Model/MACVO_FrontendCov.pth
          device: *device
          enc_dtype: fp32
          dec_dtype: fp32
      monodepth:
        type: DepthAnythingV3
        args:
          model_name: da3nested-giant-large
          weight: depth-anything/DA3NESTED-GIANT-LARGE-1.1
          device: *device
          q90: 1.

  motion:
    type: StaticMotionModel
    args:

  outlier:
    type: CovarianceSanityFilter
    args:

  postprocess:
    type: MotionInterpolate
    args:

  keyframe:
    type: AllKeyframe
    args:

  optimizer:
    type: GEDF_PGO
    args:
      device: cpu           # solver device; the mapper has its own (map.online.device)
      vectorize: true
      parallel: true
      autodiff: false       # analytic Jacobians (LM_analytic)
      graph_type: gedf+icp  # "gedf" = pure field registration
      map:
        source: online      # "prebuilt" localizes against map.path instead
        path: ""            # GDF1 .bin path; only used when source is "prebuilt"
        insert_keypoints: true
        insert_dense: false
        min_gaussians: 100  # field factor stays inert until the map has this many
        online:
          device: *device
          cube_size: 1.0
          num_gaussians: 8
          sample_points: 1000
          budget_cubes_per_frame: 8
          mae_target: 0.03
          cov_trace_gate: 0.0   # disabled for monocular depth (see header)
      field:
        weighting: mahalanobis
        sigma: 0.30         # field-error floor (m); keeps the young online map from
                            # outweighing the ICP factor (0.10 is fine for prebuilt maps)
        oob_value_threshold: 19.0
        oob_residual: 5.0
        max_grad_norm: 10.0
      solver:
        coarse_kernel_delta: 3.0
        coarse_steps: 10
        fine_kernel_delta: 0.5
        fine_steps: 10
      viz:                  # Rerun map visualization (active only with --useRR)
        every: 3           # log a map snapshot every N keyframes; 0 = disabled
        iso: 0.10           # keep sampled points with field value < iso (m)
        resolution: 0.10    # sampling grid resolution (m)
        max_points: 100000
      # Optional alignment axis (default: se3). "sim3" absorbs monocular
      # depth-scale bias during each per-frame solve (requires autodiff: true);
      # "sl4" additionally models affine/projective depth bias. The map pose
      # stays pure SE(3); sim3's estimated scale is additionally fed forward
      # into the next frame's landmark insertion to keep the online map
      # scale-consistent (see Module/Optimization/README.md).
      # alignment:
      #   type: sim3
      #   prior_weight: 100.0

Datas: !include ../Common/DeepODO_mono_experiments.yaml
Preprocess: !include ../Common/Preprocess.yaml
